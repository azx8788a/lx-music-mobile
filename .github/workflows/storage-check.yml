name: Storage Check

# 自动构建 debug APK 后在 API 30/33 模拟器上验证存储权限模型
# 判读信号：pm grant WRITE 是否成功 + 应用进程是否启动
on:
  workflow_dispatch:

jobs:
  check:
    name: Storage (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build debug APK
        shell: bash
        run: cd android && ./gradlew assembleDebug

      - name: Storage check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            set +e
            PKG=cn.toside.music.mobile
            # 找 debug APK
            APK=$(find android/app/build/outputs/apk -name "*x86_64*debug*.apk" -o -name "*universal*debug*.apk" | head -1)
            echo "APK: $APK"

            echo "=== [0] Install ==="
            adb install -r "$APK" 2>&1

            echo "=== [1] targetSdk ==="
            adb shell dumpsys package $PKG | grep -E "targetSdk|versionName" | head

            echo "=== [2] WRITE before ==="
            adb shell dumpsys package $PKG | grep WRITE_EXTERNAL | head

            echo "=== [3] pm grant WRITE ==="
            adb shell pm grant $PKG android.permission.WRITE_EXTERNAL_STORAGE 2>&1
            echo "exit: $?"

            echo "=== [4] WRITE after ==="
            adb shell dumpsys package $PKG | grep WRITE_EXTERNAL | head

            echo "=== [5] Launch app ==="
            adb shell am start -n $PKG/.MainActivity
            sleep 10
            adb shell "ps -A | grep cn.toside" && echo "PROCESS_OK" || echo "PROCESS_NOT_FOUND"

            # 无权限 shell 验证：确认目录本身可由 shell 写
            echo "=== [6] shell write probe ==="
            adb shell mkdir -p /sdcard/Music 2>&1
            adb shell touch /sdcard/Music/.ci_probe 2>&1
            adb shell ls -la /sdcard/Music/ 2>&1
            adb shell rm -f /sdcard/Music/.ci_probe

            echo "=== [7] API ${{ matrix.api }} DONE ==="